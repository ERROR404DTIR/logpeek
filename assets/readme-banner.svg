<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Logpeek</title><desc id="d">Server access logs become a readable traffic analysis chart.</desc><defs><linearGradient id="bg"><stop stop-color="#18283e"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g stroke="#30445c" stroke-width="1"><path d="M100 90H1080M100 145H1080M100 200H1080M100 255H1080"/></g><g fill="#62e3c1"><rect x="145" y="180" width="48" height="75" rx="5"><animate attributeName="height" values="75;110;75" dur="2.5s" repeatCount="indefinite"/></rect><rect x="245" y="130" width="48" height="125" rx="5"/><rect x="345" y="155" width="48" height="100" rx="5"/><rect x="445" y="95" width="48" height="160" rx="5"/><rect x="545" y="165" width="48" height="90" rx="5"/><rect x="645" y="120" width="48" height="135" rx="5"/><rect x="745" y="145" width="48" height="110" rx="5"/><rect x="845" y="105" width="48" height="150" rx="5"/></g><path d="M100 255H1080" stroke="#8fa8ff" stroke-width="2"/><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">LOGPEEK</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">REQUESTS / STATUS / TRAFFIC</text></svg>