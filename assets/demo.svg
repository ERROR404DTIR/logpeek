<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="logpeek terminal demo">
  <style>
    .l{font-family:Consolas,Menlo,monospace;font-size:15px;opacity:0;animation:show 10s infinite}
    .p{fill:#fbbf24}.m{fill:#c084fc}.g{fill:#86efac}.r{fill:#fca5a5}.d{fill:#94a3b8}.w{fill:#e7e5e4}
    .a1{animation-delay:0s}.a2{animation-delay:1.2s}.a3{animation-delay:1.8s}.a4{animation-delay:2.4s}
    .a5{animation-delay:4s}.a6{animation-delay:4.6s}.a7{animation-delay:6.2s}.a8{animation-delay:6.8s}.a9{animation-delay:7.4s}
    @keyframes show{0%{opacity:0}3%{opacity:1}92%{opacity:1}100%{opacity:0}}
  </style>
  <rect width="760" height="250" rx="12" fill="#0c0a09"/>
  <rect width="760" height="30" rx="12" fill="#292524"/>
  <circle cx="20" cy="15" r="6" fill="#f87171"/><circle cx="40" cy="15" r="6" fill="#fbbf24"/><circle cx="60" cy="15" r="6" fill="#4ade80"/>
  <text class="l a1" x="20" y="60"><tspan class="p">$</tspan><tspan class="w"> python logpeek.py access.log</tspan></text>
  <text class="l a2 w" x="20" y="84" xml:space="preserve">  requests   12,480   traffic 1.2 GB   errors 3.1%</text>
  <text class="l a3" x="20" y="104" xml:space="preserve"><tspan class="d">  Top IPs   </tspan><tspan class="m">████████░░</tspan><tspan class="w"> 203.0.113.7  1,204</tspan></text>
  <text class="l a4" x="20" y="124" xml:space="preserve"><tspan class="d">  Status    </tspan><tspan class="g">2xx 91%</tspan><tspan class="w">  3xx 3%  </tspan><tspan class="r">4xx 5%  5xx 1%</tspan></text>
  <text class="l a5" x="20" y="154"><tspan class="p">$</tspan><tspan class="w"> python logpeek.py access.log --status 404</tspan></text>
  <text class="l a6 r" x="20" y="174" xml:space="preserve">  /wp-login.php 212    /.env 97    /admin 64</text>
  <text class="l a7" x="20" y="204"><tspan class="p">$</tspan><tspan class="w"> python logpeek.py access.log --ip 203.0.113.7</tspan></text>
  <text class="l a8 w" x="20" y="224" xml:space="preserve">  requests   1,204   peak hour 14:00</text>
  <text class="l a9 m" x="20" y="242" xml:space="preserve">  ▁▁▁▂▂▃▄▅▆▇█▇▆▅▄▃▃▂▂▁▁▁▁▁</text>
</svg>
